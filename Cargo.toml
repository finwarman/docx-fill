[package]
name = "docx-fill"
description = "Fills DOCX templates written in docxtemplater's tag syntax"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/finwarman/docx-fill"
publish = false

[dependencies]
serde_json = "1"
regex = "1"
image = { version = "0.25", default-features = false, optional = true, features = ["png", "jpeg", "gif", "bmp", "tiff"] }
quircs = { version = "0.10", optional = true }
imagesize = { version = "0.15", optional = true }
simplecss = { version = "0.2", optional = true }
resvg = { version = "0.49", default-features = false, features = ["text", "raster-images"], optional = true }

zip = { version = "9", default-features = false, optional = true, features = ["deflate-flate2-zlib-rs"] }

[features]
# Reads image tags from raster QR codes. Off by default: it adds an image decoder.
qr-codes = ["dep:image", "dep:quircs"]
# Updates cloned embedded XLSX chart data without editing existing worksheet cells.
chart-workbook = ["dep:zip"]
# Generates PNG previews for SVG images without a caller-supplied fallback.
svg-preview = ["dep:resvg", "dep:imagesize", "dep:simplecss"]

[dev-dependencies]
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
qrcode = { version = "0.14", default-features = false }

[[bench]]
name = "fill"
harness = false

[[bench]]
name = "spreadsheet"
harness = false
