[package]
name = "docx-fill"
description = "Fills DOCX templates written in docxtemplater's tag syntax"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/finwarman/docx-fill"
publish = false

[dependencies]
serde_json = "1"
regex = "1"

[dev-dependencies]
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
